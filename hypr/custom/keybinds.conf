# See https://wiki.hyprland.org/Configuring/Binds/
# Cheatsheet uses bindd / bindd: 3rd field is "Category: Action"
#!
##! User
bindd = Ctrl+Super, Slash, User: Edit shell config, exec, xdg-open ~/.config/illogical-impulse/config.json
bindd = Ctrl+Super+Alt, Slash, User: Edit extra keybinds, exec, xdg-open ~/.config/hypr/custom/keybinds.conf

unbind = SUPER, C
unbind = SUPER, W
unbind = SUPER, L
unbind = SUPER, D
unbind = SUPER SHIFT, C
unbind = Ctrl+Super, R
bindd = SUPER, L, User: Toggle keep-awake, global, quickshell:idleInhibitToggle
bindd = SUPER, D, User: Toggle show desktop, exec, ~/.local/bin/show-desktop-toggle.sh
bindd = Ctrl+Super, R, User: Restart widgets, exec, killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig &

##! Web (LAlt)
bindd = ALT, C, Web (LAlt): Calculator (tiled left), exec, ~/.config/hypr/custom/scripts/launch-calc.sh
bindd = ALT, Q, Web (LAlt): Google Drive, exec, xdg-open "https://drive.google.com/drive/folders/1SBXoFGg_N8mLaUFk19SGC0jBHj1vj_SO"
bindd = ALT, V, Web (LAlt): VTOP, exec, xdg-open "https://vtop.vit.ac.in/vtop/login"
bindd = ALT, E, Web (LAlt): DeepSeek, exec, xdg-open "https://chat.deepseek.com"
bindd = ALT, W, Web (LAlt): WhatsApp Web, exec, xdg-open "https://web.whatsapp.com/"
bindd = ALT, G, Web (LAlt): Gmail account chooser, exec, ~/.config/hypr/custom/scripts/gmail-chooser.py
bindd = ALT, 3, Web (LAlt): Google AI Studio, exec, xdg-open "https://aistudio.google.com"
bindd = ALT, 4, Web (LAlt): Monkeytype, exec, xdg-open "https://monkeytype.com/"
bindd = SUPER, C, Web (LAlt): ChatGPT, exec, xdg-open "https://chatgpt.com/"
bindd = SUPER SHIFT, C, Web (LAlt): ChatGPT PWA, exec, google-chrome-stable --app=https://chatgpt.com/ --class=chatgpt-pwa

##! Web (RAlt)
bindd = MOD5, R, Web (RAlt): YouTube playlist, exec, xdg-open "https://www.youtube.com/playlist?list=PLdo5W4Nhv31bbKJzrsKfMpo_grxuLl8LU"
bindd = MOD5, K, Web (RAlt): Google Keep, exec, xdg-open "https://keep.google.com/u/1/"
bindd = MOD5, E, Web (RAlt): Examly + VIT Email, exec, bash -c 'echo -n "pratik.ambastha2025@vitstudent.ac.in" | wl-copy; echo -n "pratik.ambastha2025@vitstudent.ac.in" | wl-copy -p; xdg-open "https://vitvellore312.examly.io/"'
bindd = MOD5, Y, Web (RAlt): Google Tasks, exec, xdg-open "https://calendar.google.com/calendar/u/2/r/tasks"
bindd = MOD5, P, Web (RAlt): Papers, exec, xdg-open "https://www.papers.codechefvit.com/"
bindd = MOD5, 0, Web (RAlt): Speed Test, exec, xdg-open "https://fast.com"
bindd = MOD5, N, Web (RAlt): Toggle Nord Buds 3, exec, ~/.config/hypr/custom/scripts/toggle-buds.sh
bindd = MOD5, SPACE, Web (RAlt): Daily note, exec, kitty -e micro "/mnt/windows/Users/DELL/Dropbox/DropsyncFiles/lesser amygdala/「日常」/$(date +%d-%b-%y).md"

##! Region screenshot → vault note
bindd = CTRL, slash, Region: Region-shot capture, exec, ~/.config/hypr/custom/scripts/region-shot.sh
bindd = CTRL SHIFT, slash, Region: Region-shot re-select, exec, ~/.config/hypr/custom/scripts/region-shot.sh --reselect

#!
##! Navigation
bindd = ALT, TAB, Navigation: Previous workspace, workspace, previous

##! Quick Type
bindd = ALT, 1, Quick Type: Date [01-Mar], exec, bash -c 'v=$(date +"[%d-%b]"); echo -n "$v" | wl-copy; echo -n "$v" | wl-copy -p'
bindd = ALT, 2, Quick Type: Time [1.15am], exec, bash -c 'v=$(date +"[%-l.%M%P]"); echo -n "$v" | wl-copy; echo -n "$v" | wl-copy -p'

##! Quick Send
bindd = ALT, T, Quick Send: Telegram quick send, exec, ~/.config/hypr/custom/scripts/telegram-send.sh

##! Apps
bindd = ALT, F, Apps: Focus Mode toggle, exec, ~/.config/hypr/custom/scripts/focus-mode.sh
bindd = SUPER SHIFT, D, Apps: Daylog ritual, exec, ~/.config/hypr/custom/scripts/daylog.sh
bindd = SUPER, Z, Apps: Zen Browser, exec, zen-browser
bindd = ALT, 5, Apps: VS Code, exec, code
bindd = ALT, D, Apps: Obsidian, exec, gtk-launch obsidian
bindd = ALT, Z, Apps: Quick Capture, global, quickshell:quickCapture
bindd = ALT, SPACE, Apps: FSearch, exec, fsearch

##! Launchers
bindd = SUPER, R, Launchers: App Browser, exec, pkill rofi || rofi -show drun
bindd = SUPER, X, Launchers: Script Launcher, exec, dolphin --new-window ~/scripts/quick-access
unbind = SUPER, P
bindd = SUPER, P, Launchers: Cycle power profile, exec, ~/.config/hypr/custom/scripts/cycle-power-profile.sh

##! Folders
bindd = MOD5, O, Folders: Documents, exec, dolphin --new-window ~/Documents
bindd = ALT, X, Folders: Downloads, exec, dolphin --new-window ~/Downloads
bindd = ALT, GRAVE, Folders: Obsidian vault, exec, dolphin --new-window "/mnt/windows/Users/DELL/Dropbox/DropsyncFiles/lesser amygdala"
bindd = ALT, A, Folders: Schedule PDF, exec, xdg-open "/mnt/windows/Users/DELL/Downloads/Binder1.pdf"
bindd = ALT, S, Folders: Screenshots, exec, dolphin --new-window "/mnt/windows/Users/DELL/Pictures/Screenshots"
bindd = MOD5, I, Folders: Captures, exec, dolphin --new-window ~/Captures
bindd = MOD5, M, Folders: N-VIT WiFi login, exec, ~/.local/bin/wifi-login.sh
# binds = Alt_R, L, exec, xdg-open "/mnt/windows/Users/DELL/Documents/Timeline.xlsx"                           # Timeline spreadsheet
bindd = SUPER, SPACE, Folders: Sticky Notes, global, quickshell:stickyNotes
bindd = MOD5, L, Folders: Left tiled clocks, exec, ~/.config/hypr/custom/scripts/launch-clocks.sh

##! Dolphin contextual
bindd = CTRL SHIFT, X, Dolphin: New markdown file, exec, ~/scripts/dolphin-new-md.sh

##! Materialgram
unbind = Super, T
bindd = Super, T, Apps: Materialgram, exec, materialgram

##! Tablet extended screen
bindd = Super SHIFT, W, Tablet screen: remote desktop, exec, ~/bin/tabscreen remote

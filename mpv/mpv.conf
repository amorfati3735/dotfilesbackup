keep-open=yes
save-position-on-quit=yes
osd-bar=no
border=no
video-sync=display-resample

# Subtitle appearance
sub-font=Cantarell
sub-font-size=55
sub-color="#FFFFFF"
sub-border-size=3
sub-border-color="#000000"
sub-shadow-offset=1
sub-shadow-color="#000000"
sub-blur=0
sub-bold=no
sub-scale-by-window=yes
sub-ass-override=force
sub-use-margins=yes
# Performance
hwdec=auto
cache=yes
# mpv color theme (generated by matugen on wallpaper change)
include=~/.config/mpv/mpv-colors.conf

# Screenshots
screenshot-directory=/mnt/windows/Users/DELL/Pictures/Screenshots
screenshot-format=png
